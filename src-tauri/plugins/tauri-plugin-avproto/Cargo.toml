[package]
name = "tauri-plugin-avproto"
version = "0.1.0"
authors = ["HGhubX"]
description = "AVFoundation 混合路线验证原型（仅自检页调用，正式播放路径不依赖）"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-avproto"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Version fields
        run: node scripts/check-version-sync.mjs

      - name: Documentation links
        run: node scripts/check-doc-links.mjs

      - name: Build frontend
        run: pnpm build

      - name: Size budgets
        run: node scripts/check-size-budgets.mjs

  rust:
    name: Rust check and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf build-essential curl wget file libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri -> target
          key: ci-rust

      - name: Cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --lib

  smoke:
    name: Browser smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Resolve Chromium
        run: |
          BROWSER="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"

      - name: Run smoke fixtures
        run: pnpm test:smoke

  layout:
    name: Layout geometry gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install local media generator and headless browser
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pnpm exec playwright-core install --with-deps chromium

      - name: Resolve Chromium
        run: |
          BROWSER="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          echo "BROWSER_EXECUTABLE=$BROWSER" >> "$GITHUB_ENV"

      # 视口几何门禁：控件出视口/不可命中/重叠即失败（2026-11-18 底栏溢出回归后新增）。
      - name: Run layout geometry checks
        run: pnpm test:layout --output test-results/layout-ci

      - name: Upload layout diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: layout-diagnostics
          path: test-results/layout-ci/
          retention-days: 7
          if-no-files-found: warn
